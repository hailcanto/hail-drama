<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hail-Drama logo: black-green film-strip squircle + "H" whose crossbar is a play button -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0b1410"/>
      <stop offset="1" stop-color="#14291e"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#shine)"/>
  <!-- 细亮绿描边：放在黑绿顶栏上也能看清边缘 -->
  <rect x="44" y="44" width="936" height="936" rx="216" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="10"/>
  <g fill="#34d399" fill-opacity="0.22">
    <rect x="170" y="96" width="64" height="38" rx="12"/>
    <rect x="290" y="96" width="64" height="38" rx="12"/>
    <rect x="410" y="96" width="64" height="38" rx="12"/>
    <rect x="550" y="96" width="64" height="38" rx="12"/>
    <rect x="670" y="96" width="64" height="38" rx="12"/>
    <rect x="790" y="96" width="64" height="38" rx="12"/>
    <rect x="170" y="890" width="64" height="38" rx="12"/>
    <rect x="290" y="890" width="64" height="38" rx="12"/>
    <rect x="410" y="890" width="64" height="38" rx="12"/>
    <rect x="550" y="890" width="64" height="38" rx="12"/>
    <rect x="670" y="890" width="64" height="38" rx="12"/>
    <rect x="790" y="890" width="64" height="38" rx="12"/>
  </g>
  <g fill="url(#h)">
